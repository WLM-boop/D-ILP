world:
  height: 42
  width: 42
  step_time: 0.1
  sample_time: 0.1
  offset: [5, 5]
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 4.6, width: 1.6, wheelbase: 0}
    description: 'car_red.png'
    state: [10, 10, 0]
    goal: [40, 40, 0]
    vel_min: [-8, -1]
    vel_max: [8, 1]
    goal_threshold: 0.8
    plot:
      show_trail: True
      show_goal: False
      show_arrow: True
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 15
        angle_range: 3.1415926
        number: 200
        noise: False

obstacle:
  - number: 3
    distribution: {name: 'manual'}
    state: [[20, 26, 2.5], [32, 18, -0.5], [36, 34, -2.0]]
    kinematics: {name: 'diff'}
    shape:
      - {name: 'circle', radius: 2.2}
      - {name: 'circle', radius: 2.0}
      - {name: 'circle', radius: 2.5}
    behavior:
      - {name: 'dash', wander: True}
    color: ['dodgerblue', 'royalblue', 'steelblue']
    vel_min: [-0.4, -0.6]
    vel_max: [0.5, 0.6]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True
      show_trail: False
  - number: 2
    distribution: {name: 'manual'}
    state: [[20, 32, -0.8], [30, 22, 2.2]]
    kinematics: {name: 'diff'}
    shape:
      - {name: 'circle', radius: 1.8}
      - {name: 'circle', radius: 1.5}
    behavior:
      - {name: 'dash', wander: False}
    color: ['deepskyblue', 'lightblue']
    vel_min: [-0.4, -0.5]
    vel_max: [0.5, 0.5]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True
      show_trail: False
  - number: 5
    distribution: {name: 'manual'}
    state: [[18, 39, 0.5], [30, 43, 1.5], [40, 16, -1.0], [43, 27, 2.0], [10, 19, 0.8]]
    kinematics: {name: 'diff'}
    shape:
      - {name: 'circle', radius: 3.0}
      - {name: 'circle', radius: 2.0}
      - {name: 'circle', radius: 2.5}
      - {name: 'circle', radius: 2.5}
      - {name: 'circle', radius: 2.0}
    behavior:
      - {name: 'dash', wander: True}
    color: ['cornflowerblue', 'lightskyblue', 'skyblue', 'paleturquoise', 'powderblue']
    vel_min: [-0.4, -0.5]
    vel_max: [0.5, 0.5]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True
      show_trail: False
